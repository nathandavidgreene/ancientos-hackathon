[workspace]
resolver = "2"
members = ["crates/core", "crates/router", "crates/bookmarks-agent", "crates/demo-runner", "crates/web-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
tempfile = "3"
getrandom = "0.2"
